<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nothing here</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --ink: #1a1a1a; --dim: #8a8a8a; --blue: #0046fb; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e4e4e4; --dim: #7a7a7a; --blue: #6f96ff; } }
  ::selection { background: #0046fb; color: #fff; }
  body {
    font-family: ui-monospace, Menlo, Monaco, "Courier New", monospace;
    font-size: 15px; line-height: 1.7; color: var(--ink);
    max-width: 64ch; margin: 0 auto; padding: 4rem 1.25rem;
  }
  a { color: var(--blue); text-underline-offset: 3px; }
  a:hover { background: var(--blue); color: #fff; text-decoration: none; }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<p><strong>404 — nothing here.</strong></p>
<p class="dim">Whatever used to live at this address is gone, moved, or never was.</p>
<p>The pile is at <a href="/">rusinov.ro</a>.</p>
</body>
</html>
