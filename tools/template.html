<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Rusinov</title>
<meta name="description" content="Roman Rusinov — designer, illustrator and maker in Brevard, NC. A pile of things made.">
<meta property="og:title" content="Roman Rusinov">
<meta property="og:description" content="Designer, illustrator and maker in Brevard, NC. A pile of things made.">
<meta property="og:image" content="https://rusinov.ro/assets/img/5d546bafaa636171790ab19e_roman-rusinov-open-graph.jpg">
<link rel="shortcut icon" href="/assets/img/5a3423489a6260000106454b_favicon.png" type="image/x-icon">
<link rel="apple-touch-icon" href="/assets/img/5b0d832059d24835a62a2d90_webclip.png">
<style>
  :root {
    color-scheme: light dark;
    --ink: #1a1a1a;
    --dim: #8a8a8a;
    --blue: #0046fb;
    --line: #d8d8d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e4e4e4; --dim: #7a7a7a; --blue: #6f96ff; --line: #333; }
  }
  ::selection { background: #0046fb; color: #fff; }
  body {
    font-family: ui-monospace, Menlo, Monaco, "Courier New", monospace;
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    max-width: 64ch;
    margin: 0 auto;
    padding: 4rem 1.25rem 6rem;
  }
  a { color: var(--blue); text-underline-offset: 3px; }
  a:hover { background: var(--blue); color: #fff; text-decoration: none; }
  /* the name has been upside down since 2015 */
  h1 {
    font-size: 1em;
    font-weight: 700;
    margin: 0 0 2.5rem;
    letter-spacing: .04em;
    text-transform: lowercase;
    transform: rotate(180deg);
    display: inline-block;
  }
  .now { margin: 2rem 0; }
  .now b { font-weight: 700; }
  .meta { color: var(--dim); }
  hr { border: 0; border-top: 1px dashed var(--line); margin: 3.5rem 0; }
  .pile > * { margin: 0 0 4.5rem; }
  .pile img { width: 100%; height: auto; display: block; }
  .cap { color: var(--dim); font-size: 0.92em; margin-top: .6rem; }
  .say { font-size: 1em; }
  .pinned::before {
    content: "pinned";
    display: block;
    color: var(--dim);
    font-size: .8em;
    letter-spacing: .12em;
    margin-bottom: .45rem;
  }
  .circa { color: var(--dim); }
  .vid iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
  footer { color: var(--dim); font-size: .92em; margin-top: 5rem; }
</style>
</head>
<body>

<h1>ROMAN RUSINOV</h1>

{{hero}}

<p class="now"><b>now</b> — {{now}}</p>

<p class="meta"><a href="#" data-mail>hello [at] rusinov [dot] ro</a> &nbsp;·&nbsp;
<a href="https://www.instagram.com/rusinov.ro/">instagram</a> &nbsp;·&nbsp;
<a href="https://www.youtube.com/c/RomanRusinovFilms">youtube</a> &nbsp;·&nbsp;
<a href="https://www.linkedin.com/in/themanro">linkedin</a> &nbsp;·&nbsp;
<a href="https://ikari.wtf">shop</a></p>

<hr>

<div class="pile">

{{pile}}

</div>

<footer>
<hr>
<p>The pile grows when I make things. No dates, no promises.<br>
© 2026 Roman Rusinov</p>
</footer>

<script>
/* assembled client-side so the address isn't scrapeable from the HTML */
document.addEventListener('DOMContentLoaded', function () {
  var u = 'hello' + '@' + 'rusinov' + '.' + 'ro';
  document.querySelectorAll('a[data-mail]').forEach(function (a) {
    a.href = 'mailto:' + u;
    a.textContent = u;
  });
});
</script>

</body>
</html>
